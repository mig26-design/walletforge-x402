[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "walletforge-x402"
version = "0.1.0"
description = "x402 paid micro-utilities for LangChain and Coinbase AgentKit on Base"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "eth-account>=0.11.0",
    "pydantic>=2.0",
    "langchain-core>=0.2.0"
]

[tool.setuptools]
py-modules = ["langchain_tools", "agentkit_provider"]
